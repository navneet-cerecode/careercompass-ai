# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render staging blueprint. Secret values are entered in Render during the first sync.
previews:
  generation: "off"

services:
  - type: keyvalue
    name: solara-hire-staging-redis
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: solara-hire-staging-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: solara-hire-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: solara-hire-staging-redis
          property: connectionString
      - key: TASK_TOKEN_SECRET
        generateValue: true
      - key: ANALYTICS_IDENTITY_SALT
        generateValue: true
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: THE_MUSE_API_KEY
        sync: false
      - key: WORKER_BROKER_NAMESPACE
        value: solarahire-staging
      - key: WORKER_QUEUE_NAME
        value: solarahire-staging
      - key: ANALYTICS_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: solara-hire-staging-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: python -m dramatiq workers.entrypoint --processes 1 --threads 4
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        value: worker.internal
      - key: DATABASE_URL
        fromDatabase:
          name: solara-hire-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: solara-hire-staging-redis
          property: connectionString
      - key: TASK_TOKEN_SECRET
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: TASK_TOKEN_SECRET
      - key: AUTH_ISSUER
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: AUTH_ISSUER
      - key: AUTH_AUDIENCE
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: AUTH_AUDIENCE
      - key: AUTH_JWKS_URL
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: AUTH_JWKS_URL
      - key: GROQ_API_KEY
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: GROQ_API_KEY
      - key: RAPIDAPI_KEY
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: RAPIDAPI_KEY
      - key: ADZUNA_APP_ID
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: ADZUNA_APP_ID
      - key: ADZUNA_APP_KEY
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: ADZUNA_APP_KEY
      - key: THE_MUSE_API_KEY
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: THE_MUSE_API_KEY
      - key: WORKER_BROKER_NAMESPACE
        value: solarahire-staging
      - key: WORKER_QUEUE_NAME
        value: solarahire-staging
      - key: LOG_LEVEL
        value: INFO

  - type: cron
    name: solara-hire-staging-maintenance
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: python -m workers.enqueue_maintenance
    schedule: "*/2 * * * *"
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        value: maintenance.internal
      - key: DATABASE_URL
        fromDatabase:
          name: solara-hire-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: solara-hire-staging-redis
          property: connectionString
      - key: TASK_TOKEN_SECRET
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: TASK_TOKEN_SECRET
      - key: AUTH_ISSUER
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: AUTH_ISSUER
      - key: AUTH_AUDIENCE
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: AUTH_AUDIENCE
      - key: AUTH_JWKS_URL
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: AUTH_JWKS_URL
      - key: WORKER_BROKER_NAMESPACE
        value: solarahire-staging
      - key: WORKER_QUEUE_NAME
        value: solarahire-staging
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: solara-hire-staging-web
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: SOLARAHIRE_API_URL
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_BASE_URL
        fromService:
          type: web
          name: solara-hire-staging-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SOLARAHIRE_SITE_URL
        fromService:
          type: web
          name: solara-hire-staging-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_SECRET
        generateValue: true
      - key: AUTH0_AUDIENCE
        fromService:
          type: web
          name: solara-hire-staging-api
          envVarKey: AUTH_AUDIENCE
      - key: AUTH0_SCOPE
        value: openid profile email offline_access

databases:
  - name: solara-hire-staging-postgres
    plan: basic-256mb
    region: singapore
    databaseName: solarahire_staging
    user: solarahire
    ipAllowList: []
