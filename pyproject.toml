[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgres: requires the TEST_DATABASE_URL PostgreSQL integration database",
    "redis: requires the TEST_REDIS_URL Redis integration broker",
]

[tool.ruff]
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]

[tool.ruff.lint.per-file-ignores]
"ui/app.py" = ["E402"]
