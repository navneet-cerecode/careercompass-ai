name: careercompass

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: careercompass
      POSTGRES_USER: careercompass
      POSTGRES_PASSWORD: careercompass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - careercompass_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careercompass -d careercompass"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - careercompass_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  careercompass_postgres_data:
  careercompass_redis_data:
