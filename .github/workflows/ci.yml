name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: careercompass_test
          POSTGRES_USER: careercompass
          POSTGRES_PASSWORD: careercompass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careercompass -d careercompass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GROQ_API_KEY: test-groq-key
      RAPIDAPI_KEY: test-rapidapi-key
      TEST_DATABASE_URL: postgresql+psycopg://careercompass:careercompass@localhost:5432/careercompass_test
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-db.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-db.txt
          python -m pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify generated API contract
        working-directory: frontend
        run: |
          npm run contract:generate
          git diff --exit-code -- src/lib/api/openapi.json src/lib/api/schema.d.ts

      - name: Lint current Python boundary
        run: >-
          ruff check
          api
          agents/candidate_evaluation_agent.py
          core/config.py
          core/career_compass.py
          database
          graph/nodes.py
          graph/state.py
          graph/workflow.py
          app.py
          models/application.py
          models/enums.py
          models/job.py
          models/job_recommendation.py
          models/match.py
          models/match_assessment.py
          models/recommendation_result.py
          models/resume.py
          models/score_component.py
          models/skill.py
          services/formatters/resume_formatter.py
          services/job_discovery/discovery_service.py
          services/job_discovery/fingerprint.py
          services/job_discovery/pipeline
          services/job_discovery/providers/__init__.py
          services/job_discovery/providers/api_provider.py
          services/job_discovery/providers/base_provider.py
          services/job_discovery/providers/companies.py
          services/job_discovery/providers/contracts.py
          services/job_discovery/providers/dummy_provider.py
          services/job_discovery/providers/errors.py
          services/job_discovery/providers/jsearch_provider.py
          services/job_discovery/providers/provider_factory.py
          services/job_discovery/providers/workday_provider.py
          services/jobs/providers/base_provider.py
          services/llm/evaluator.py
          services/llm/groq_client.py
          services/recommendation/fusion.py
          services/recommendation/models/signal_result.py
          services/recommendation/recommendation_engine.py
          services/recommendation/recommendation_service.py
          services/recommendation/signals/base_signal.py
          services/recommendation/signals/semantic_signal.py
          services/recommendation/signals/skill_signal.py
          services/resume/parser_service.py
          scripts/export_openapi.py
          scripts/smoke_frontend.py
          scripts/test_env.py
          scripts/test_registry.py
          ui/components/resume_upload.py
          ui/app.py
          tests

      - name: Check current Python formatting
        run: >-
          ruff format --check
          api
          agents/candidate_evaluation_agent.py
          core/config.py
          core/career_compass.py
          database
          graph/nodes.py
          graph/state.py
          graph/workflow.py
          app.py
          models/application.py
          models/enums.py
          models/job.py
          models/job_recommendation.py
          models/match.py
          models/match_assessment.py
          models/recommendation_result.py
          models/resume.py
          models/score_component.py
          models/skill.py
          services/formatters/resume_formatter.py
          services/job_discovery/discovery_service.py
          services/job_discovery/fingerprint.py
          services/job_discovery/pipeline
          services/job_discovery/providers/__init__.py
          services/job_discovery/providers/api_provider.py
          services/job_discovery/providers/base_provider.py
          services/job_discovery/providers/companies.py
          services/job_discovery/providers/contracts.py
          services/job_discovery/providers/dummy_provider.py
          services/job_discovery/providers/errors.py
          services/job_discovery/providers/jsearch_provider.py
          services/job_discovery/providers/provider_factory.py
          services/job_discovery/providers/workday_provider.py
          services/jobs/providers/base_provider.py
          services/llm/evaluator.py
          services/llm/groq_client.py
          services/recommendation/fusion.py
          services/recommendation/models/signal_result.py
          services/recommendation/recommendation_engine.py
          services/recommendation/recommendation_service.py
          services/recommendation/signals/base_signal.py
          services/recommendation/signals/semantic_signal.py
          services/recommendation/signals/skill_signal.py
          services/resume/parser_service.py
          scripts/export_openapi.py
          scripts/smoke_frontend.py
          scripts/test_env.py
          scripts/test_registry.py
          ui/components/resume_upload.py
          ui/app.py
          tests

      - name: Check frontend quality
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm audit --audit-level=high

      - name: Run offline tests
        run: python -m pytest -m "not postgres"

      - name: Run PostgreSQL persistence gate
        run: python -m pytest -m postgres
